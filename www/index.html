<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Glow Flower Animation - Realistic</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:'Segoe UI',sans-serif; }
  body { display:flex; align-items:flex-end; justify-content:center; min-height:100vh; background:#02040a; overflow:hidden; }
  .night { position:fixed; inset:0;
    background-image:
      radial-gradient(ellipse at top, rgba(40,60,90,0.4) 0%, transparent 55%),
      radial-gradient(ellipse at bottom, #030712, rgba(30,140,160,0.2)),
      linear-gradient(180deg, #010205 0%, #04101a 60%, #06161f 100%); }
  .stars { position:absolute; inset:0; }
  .star { position:absolute; background:#fff; border-radius:50%; animation: twinkle ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:0.15;} 50%{opacity:1;} }
  .shoot { position:absolute; width:70px; height:2px; background:linear-gradient(to left, #fff, transparent);
    top:12%; left:-10%; opacity:0; transform:rotate(18deg); animation: shoot-move 7s ease-in 1.5s infinite; }
  @keyframes shoot-move {
    0% { opacity:0; transform:translate(0,0) rotate(18deg); }
    2% { opacity:1; }
    8% { opacity:0; transform:translate(60vw,25vh) rotate(18deg); }
    100% { opacity:0; }
  }
  .moon-wrap { position:absolute; top:5%; right:11%; width:100px; height:100px; }
  .moon { position:absolute; top:15px; left:15px; width:70px; height:70px; border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #f8fbff, #d3e3f0 55%, #a9c2d6 100%);
    box-shadow: 0 0 60px 22px rgba(190,215,240,0.4); animation: moon-glow 5s ease-in-out infinite; }
  .moon::before, .moon::after { content:""; position:absolute; border-radius:50%; background:rgba(160,185,205,0.4); }
  .moon::before { width:14px; height:14px; top:14px; left:10px; }
  .moon::after { width:9px; height:9px; top:34px; left:40px; }
  @keyframes moon-glow { 0%,100%{opacity:0.92;} 50%{opacity:1;} }

  .mist { position:absolute; left:-20%; width:140%; height:60px; bottom:14vh;
    background: linear-gradient(to top, rgba(120,220,210,0.12), transparent);
    filter: blur(8px); animation: mist-drift 18s ease-in-out infinite; }
  @keyframes mist-drift { 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(4%); } }

  .firefly { position:absolute; width:4px; height:4px; border-radius:50%; background:#c8ffb0;
    box-shadow:0 0 8px 3px rgba(200,255,170,0.8); opacity:0; animation: firefly-move ease-in-out infinite; }
  @keyframes firefly-move {
    0% { opacity:0; transform:translate(0,0); }
    20% { opacity:1; }
    50% { transform:translate(var(--fx,20px), var(--fy,-24px)); }
    80% { opacity:1; }
    100% { opacity:0; transform:translate(var(--fx2,-16px), var(--fy2,-40px)); }
  }

  .scene { position:relative; width:100%; height:100vh; }
  .ground { position:absolute; left:0; right:0; bottom:0; height:16vh;
    background: linear-gradient(to bottom, #06251f 0%, #021009 100%);
    box-shadow: inset 0 14px 22px rgba(0,255,220,0.07); }
  .ground::before { content:""; position:absolute; top:0; left:0; right:0; height:6px;
    background: linear-gradient(90deg, transparent, rgba(90,240,220,0.25), transparent); }

  .ground-shadow { position:absolute; bottom:15.6vh; width:110px; height:14px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.5), transparent 70%); border-radius:50%; }

  .plant { position:absolute; bottom:16vh; transform-origin:bottom center;
    animation: sway 4.5s ease-in-out infinite alternate; }
  @keyframes sway { from{transform:translateX(-50%) rotate(-2.6deg);} to{transform:translateX(-50%) rotate(2.6deg);} }

  .pot { position:absolute; bottom:-4px; left:50%; transform:translateX(-50%); width:70px; height:44px;
    background: linear-gradient(135deg, #123c3a, #0a2523 60%, #051614);
    clip-path: polygon(14% 0, 86% 0, 100% 100%, 0% 100%);
    box-shadow: inset -6px 0 8px rgba(0,0,0,0.4), 0 0 10px rgba(30,140,130,0.25); }
  .pot-rim { position:absolute; bottom:38px; left:50%; transform:translateX(-50%); width:78px; height:10px;
    background: linear-gradient(180deg, #1c5450, #0d302d); border-radius:6px;
    box-shadow: 0 0 8px rgba(30,140,130,0.3); }
  .soil { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); width:58px; height:7px;
    background: radial-gradient(ellipse, #16110a, #08050300); border-radius:50%; opacity:0.8; }

  .stem { position:absolute; bottom:44px; left:50%; width:6px; height:0;
    background: linear-gradient(to top, #0b5c56, #14a89c 60%, #4ff0e0);
    border-radius:4px; transform:translateX(-50%);
    box-shadow: 0 0 10px rgba(60,240,220,0.5);
    animation: grow-stem 2.3s ease-out forwards; }
  @keyframes grow-stem { to { height:var(--sh,240px); } }

  .leaf { position:absolute; width:44px; height:56px;
    border-radius:51% 49% 47% 53%/44% 45% 55% 69%;
    background: linear-gradient(to top, #0e6b62, #4ff0e0);
    box-shadow: inset 0 0 10px rgba(255,255,255,0.25), 0 0 12px rgba(60,240,220,0.4);
    opacity:0; transform:scale(0);
    animation: leaf-pop 0.8s cubic-bezier(.34,1.56,.64,1) forwards; }
  .leaf::after { content:""; position:absolute; top:45%; left:10%; width:70%; height:1.5px;
    background:rgba(255,255,255,0.3); transform:rotate(-6deg); }
  @keyframes leaf-pop { to { opacity:0.95; transform:scale(1); } }

  .bud { position:absolute; left:50%; transform:translateX(-50%) scale(0);
    width:22px; height:30px; border-radius:50%/60% 60% 40% 40%;
    background: linear-gradient(to top, #0e6b62, #4ff0e0); opacity:0;
    box-shadow:0 0 14px rgba(60,240,220,0.5);
    animation: bud-in 0.7s ease-out forwards; }
  @keyframes bud-in { to { opacity:0.95; transform:translateX(-50%) scale(1); } }

  .flower { position:absolute; left:50%; transform:translateX(-50%) scale(0); opacity:0;
    animation: bloom-in 0.9s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes bloom-in { to { opacity:1; transform:translateX(-50%) scale(1); } }

  .petal { position:absolute; width:26px; height:48px; left:-13px; top:-48px;
    border-radius:51% 49% 47% 53%/44% 45% 55% 69%;
    background: linear-gradient(to top, #0aa9c9, #9df7ff);
    box-shadow: inset 0 0 10px rgba(255,255,255,0.45), 0 0 18px rgba(90,230,255,0.7);
    transform-origin:bottom center; opacity:0.96; }
  .petal::after { content:""; position:absolute; top:16%; left:47%; width:1.5px; height:60%; background:rgba(255,255,255,0.5); }
  .petal:nth-child(1){transform:rotate(0deg);}
  .petal:nth-child(2){transform:rotate(51deg);}
  .petal:nth-child(3){transform:rotate(102deg);}
  .petal:nth-child(4){transform:rotate(153deg);}
  .petal:nth-child(5){transform:rotate(204deg);}
  .petal:nth-child(6){transform:rotate(255deg);}
  .petal:nth-child(7){transform:rotate(306deg);}

  .flower-center { position:absolute; width:26px; height:26px; left:-13px; top:-48px; border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #fffbe0, #ffe27a 55%, #e6a929 100%);
    box-shadow: 0 0 22px 7px rgba(255,220,120,0.65), inset 0 0 6px rgba(0,0,0,0.2); }
  .flower-center::after { content:""; position:absolute; inset:5px; border-radius:50%;
    background-image: radial-gradient(circle, #b97e12 1.2px, transparent 1.2px); background-size:5px 5px; opacity:0.4; }

  .glow-under { position:absolute; left:50%; transform:translateX(-50%);
    width:130px; height:130px; border-radius:50%;
    background: radial-gradient(circle, rgba(90,230,255,0.32), transparent 70%);
    filter: blur(8px); opacity:0; animation: glow-fade-in 1s ease forwards; }
  @keyframes glow-fade-in { to { opacity:1; } }

  .light { position:absolute; width:5px; height:5px; border-radius:50%;
    background:#7ff7ff; box-shadow:0 0 8px 3px rgba(120,245,255,0.7);
    opacity:0; animation: light-rise 4s linear infinite; }
  .light:nth-child(odd) { background:#ffe27a; box-shadow:0 0 8px 3px rgba(255,226,122,0.7); }
  @keyframes light-rise { 0%{opacity:0; transform:translateY(0);} 15%{opacity:1;} 85%{opacity:1;} 100%{opacity:0; transform:translateY(-160px);} }

  .grass { position:absolute; bottom:16vh; width:4px; height:0; border-radius:4px 4px 0 0;
    background: linear-gradient(to top, #0b5c56, #14a89c); box-shadow:0 0 6px rgba(60,200,190,0.5);
    transform-origin:bottom center;
    animation: grass-grow 1.5s ease-out forwards, grass-sway 3s ease-in-out infinite; }
  @keyframes grass-grow { to { height:var(--gh,30px); } }
  @keyframes grass-sway { 0%,100%{transform:rotate(var(--gr,-5deg));} 50%{transform:rotate(calc(var(--gr,-5deg) * -1));} }
</style>
</head>
<body>
<div class="night"></div>
<div class="stars" id="stars"></div>
<div class="shoot"></div>
<div class="moon-wrap"><div class="moon"></div></div>
<div class="mist"></div>
<div id="fireflies"></div>

<div class="scene">
  <div class="grass" style="left:10%; --gh:26px; --gr:-6deg; animation-delay:0.1s,0s;"></div>
  <div class="grass" style="left:15%; --gh:38px; --gr:5deg; animation-delay:0.3s,0.2s;"></div>
  <div class="grass" style="left:88%; --gh:30px; --gr:6deg; animation-delay:0.2s,0.1s;"></div>
  <div class="grass" style="left:93%; --gh:22px; --gr:-4deg; animation-delay:0.5s,0.4s;"></div>
  <div class="grass" style="left:34%; --gh:20px; --gr:-3deg; animation-delay:0.6s,0.5s;"></div>
  <div class="grass" style="left:66%; --gh:24px; --gr:4deg; animation-delay:0.4s,0.3s;"></div>

  <div class="ground-shadow" style="left:calc(50% - 55px); transform:translateX(-50%);"></div>
  <div class="plant" style="left:calc(50% - 55px);">
    <div class="pot-rim"></div><div class="soil"></div><div class="pot"></div>
    <div class="stem" style="--sh:170px;"></div>
    <div class="leaf" style="bottom:110px; left:calc(50% - 40px); transform:rotate(55deg); animation-delay:1.1s;"></div>
    <div class="leaf" style="bottom:150px; left:calc(50% + 2px); transform:rotate(-55deg) scaleX(-1); animation-delay:1.4s;"></div>
    <div class="bud" style="bottom:260px; width:18px; height:24px; animation-delay:1.8s;"></div>
    <div class="glow-under" style="bottom:236px;"></div>
    <div class="flower" style="bottom:256px; animation-delay:2.4s;">
      <div class="petal"></div><div class="petal"></div><div class="petal"></div>
      <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
      <div class="flower-center"></div>
    </div>
  </div>

  <div class="ground-shadow" style="left:50%; transform:translateX(-50%);"></div>
  <div class="plant" style="left:50%; z-index:2;">
    <div class="pot-rim"></div><div class="soil"></div><div class="pot"></div>
    <div class="stem" style="--sh:250px;"></div>
    <div class="leaf" style="bottom:140px; left:calc(50% - 46px); transform:rotate(55deg); animation-delay:1.3s;"></div>
    <div class="leaf" style="bottom:190px; left:calc(50% + 4px); transform:rotate(-55deg) scaleX(-1); animation-delay:1.6s;"></div>
    <div class="bud" style="bottom:330px; animation-delay:2.1s;"></div>
    <div class="glow-under" style="bottom:300px;"></div>
    <div class="flower" style="bottom:326px; animation-delay:2.7s;">
      <div class="petal"></div><div class="petal"></div><div class="petal"></div>
      <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
      <div class="flower-center"></div>
    </div>
    <div class="light" style="left:calc(50% - 40px); bottom:380px; animation-delay:3.4s;"></div>
    <div class="light" style="left:calc(50% + 30px); bottom:400px; animation-delay:3.9s;"></div>
    <div class="light" style="left:calc(50% - 10px); bottom:440px; animation-delay:4.4s;"></div>
    <div class="light" style="left:calc(50% + 50px); bottom:360px; animation-delay:2.9s;"></div>
  </div>

  <div class="ground-shadow" style="left:calc(50% + 55px); transform:translateX(-50%);"></div>
  <div class="plant" style="left:calc(50% + 55px);">
    <div class="pot-rim"></div><div class="soil"></div><div class="pot"></div>
    <div class="stem" style="--sh:150px;"></div>
    <div class="leaf" style="bottom:100px; left:calc(50% - 38px); transform:rotate(55deg); animation-delay:1s;"></div>
    <div class="leaf" style="bottom:135px; left:calc(50% + 2px); transform:rotate(-55deg) scaleX(-1); animation-delay:1.3s;"></div>
    <div class="bud" style="bottom:236px; width:16px; height:22px; animation-delay:1.6s;"></div>
    <div class="glow-under" style="bottom:212px;"></div>
    <div class="flower" style="bottom:232px; animation-delay:2.2s;">
      <div class="petal"></div><div class="petal"></div><div class="petal"></div>
      <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
      <div class="flower-center"></div>
    </div>
  </div>

  <div class="ground"></div>
</div>

<script>
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = (Math.random() * 1.8 + 0.8).toFixed(1);
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 60 + '%';
    s.style.animationDuration = (Math.random() * 2 + 2) + 's';
    s.style.animationDelay = (Math.random() * 3) + 's';
    starsEl.appendChild(s);
  }
  const flyEl = document.getElementById('fireflies');
  for (let i = 0; i < 12; i++) {
    const f = document.createElement('div');
    f.className = 'firefly';
    f.style.left = (10 + Math.random() * 80) + '%';
    f.style.top = (55 + Math.random() * 30) + '%';
    f.style.setProperty('--fx', (Math.random() * 60 - 30) + 'px');
    f.style.setProperty('--fy', (Math.random() * -60 - 10) + 'px');
    f.style.setProperty('--fx2', (Math.random() * 60 - 30) + 'px');
    f.style.setProperty('--fy2', (Math.random() * -100 - 20) + 'px');
    f.style.animationDuration = (Math.random() * 3 + 5) + 's';
    f.style.animationDelay = (Math.random() * 5) + 's';
    flyEl.appendChild(f);
  }
</script>
</body>
</html>
