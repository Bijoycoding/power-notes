<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power_Notes</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --bg:#F9F7F2; --surface:#FFFFFF; --surface-2:#F3EFE8; --border:#E8E2D8;
  --text:#1B1E2A; --muted:#6B6F80; --muted-2:#8A8D9C;
  --accent:#D98A2B; --accent-ink:#7A4E14; --accent-soft:#FBEBD2;
  --teal:#1E8F86; --teal-soft:#DDF2EF;
  --danger:#C7473C; --danger-soft:#FBE4E1;
  --radius:14px; --radius-sm:8px;
  --shadow: 0 1px 2px rgba(27,30,42,.04), 0 6px 16px -8px rgba(27,30,42,.12);
  --font-display:'Sora','Hind Siliguri',sans-serif;
  --font-body:'Hind Siliguri','Sora',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
[data-theme="dark"]{
  --bg:#12141C; --surface:#1A1D28; --surface-2:#232735; --border:#2C3040;
  --text:#EDEBE3; --muted:#9A9CAE; --muted-2:#7B7E90;
  --accent:#E8A33D; --accent-ink:#FCE3B6; --accent-soft:#3A2B12;
  --teal:#3FC7BB; --teal-soft:#123230;
  --danger:#E2574C; --danger-soft:#3A1613;
  --shadow: 0 1px 2px rgba(0,0,0,.2), 0 10px 28px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body); background:var(--bg); color:var(--text);
  height:100vh; overflow:hidden; -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
::selection{ background:var(--accent-soft); }
button{font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; outline:none; user-select:none; transition:transform .12s ease, background .15s ease, border-color .15s ease, opacity .15s ease, box-shadow .15s ease;}
button:active{ transform:scale(.96); }
a{ -webkit-tap-highlight-color:transparent; }
input,textarea,select{font-family:inherit; color:var(--text); background:transparent; -webkit-tap-highlight-color:transparent;}
input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{
  outline:2px solid var(--accent); outline-offset:1px; border-radius:4px;
}
::-webkit-scrollbar{width:6px; height:6px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

#app{ display:flex; height:100vh; width:100vw; }

/* ---------- FAB Menu ---------- */
.fab{
  position:fixed; bottom:22px; right:22px; width:54px; height:54px; border-radius:50%;
  background:linear-gradient(150deg,var(--accent),#B9631C); color:#fff; border:none;
  display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px -6px rgba(217,138,43,.55);
  z-index:60; transition:transform .25s ease, box-shadow .25s ease;
}
.fab:hover{ box-shadow:0 12px 28px -8px rgba(217,138,43,.7); }
.fab svg{ width:22px; height:22px; transition:transform .25s ease; }
.fab.open svg{ transform:rotate(45deg); }
.fab:active{ transform:scale(.92); }
.fab-backdrop{
  position:fixed; inset:0; background:rgba(10,10,14,.4); z-index:55; opacity:0; pointer-events:none; transition:opacity .2s ease; backdrop-filter:blur(2px);
}
.fab-backdrop.show{ opacity:1; pointer-events:auto; }
.fab-menu{
  position:fixed; bottom:84px; right:22px; display:flex; flex-direction:column; align-items:flex-end; gap:8px; z-index:59;
  opacity:0; pointer-events:none; transform:translateY(8px); transition:opacity .18s ease, transform .18s ease;
}
.fab-menu.open{ opacity:1; pointer-events:auto; transform:translateY(0); }
.fab-item{
  display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); color:var(--text);
  padding:9px 14px 9px 10px; border-radius:22px; font-size:12.5px; font-weight:700; box-shadow:var(--shadow); white-space:nowrap;
}
.fab-item:hover{ border-color:var(--muted-2); }
.fab-item .fi-ico{ width:24px; height:24px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--muted); }
.fab-item .fi-ico svg{ width:13px; height:13px; }
.fab-item.active{ border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft); }
.fab-item.active .fi-ico{ background:var(--accent); color:#fff; }
.brandmark{
  width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  background:linear-gradient(150deg,var(--accent),#B9631C); color:#fff;
}
.brandmark svg{ width:16px; height:16px; }

/* ---------- Main ---------- */
.main{ flex:1; display:flex; flex-direction:column; min-width:0; height:100vh; }
.topbar{
  display:flex; align-items:center; gap:12px; padding:14px 22px; border-bottom:1px solid var(--border);
  flex-shrink:0; background:var(--bg);
}
.topbar h1{ font-family:var(--font-display); font-size:18px; font-weight:700; margin:0; letter-spacing:-.2px; }
.searchbox{
  flex:1; max-width:380px; display:flex; align-items:center; gap:8px; background:var(--surface);
  border:1px solid var(--border); border-radius:10px; padding:7px 12px; color:var(--muted);
}
.searchbox svg{ width:15px; height:15px; flex-shrink:0; }
.searchbox input{ border:none; flex:1; font-size:13px; color:var(--text); }
.spacer{ flex:1; }
.btn{
  display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:12.5px; font-weight:600; transition:.15s;
}
.btn:hover{ border-color:var(--muted-2); box-shadow:var(--shadow); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:#231404; }
.btn.primary:hover{ filter:brightness(1.06); }
.btn.teal{ background:var(--teal); border-color:var(--teal); color:#04211E; }
.btn.danger{ background:var(--danger); border-color:var(--danger); color:#fff; }
.btn.ghost{ background:transparent; border-color:transparent; }
.btn.ghost:hover{ background:var(--surface-2); }
.btn.sm{ padding:5px 9px; font-size:11.5px; border-radius:7px; }
.btn svg{ width:14px; height:14px; }
.iconbtn{
  width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:8px; border:1px solid transparent;
  background:transparent; color:var(--muted); flex-shrink:0;
}
.iconbtn:hover{ background:var(--surface-2); color:var(--text); }
.iconbtn.active{ color:var(--accent); }
.iconbtn svg{ width:16px; height:16px; }

.content{ flex:1; overflow-y:auto; padding:18px 22px 50px; }

/* ---------- Tabs / chips ---------- */
.tabs{ display:flex; gap:4px; margin-bottom:10px; flex-wrap:wrap; }
.tab{
  padding:4px 10px; border-radius:14px; border:1px solid var(--border); background:var(--surface); color:var(--muted);
  font-size:11px; font-weight:600;
}
.tab.active{ background:var(--text); color:var(--bg); border-color:var(--text); }
.chiprow{ display:flex; gap:4px; flex-wrap:wrap; margin-bottom:12px; }
.chip{
  padding:3px 9px; border-radius:14px; font-size:10.5px; font-weight:600; border:1px solid var(--border); background:var(--surface); color:var(--muted);
}
.chip.active{ background:var(--teal-soft); color:var(--teal); border-color:var(--teal); }

/* ---------- Banner ---------- */
.banner{
  display:flex; align-items:center; gap:10px; background:var(--teal-soft); border:1px solid var(--teal); color:var(--teal);
  padding:10px 14px; border-radius:12px; margin-bottom:14px; font-size:12.5px; font-weight:600;
}
.banner svg{ width:16px; height:16px; flex-shrink:0; }
.banner .spacer{ flex:1; }

/* ---------- Note grid ---------- */
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px;
  display:flex; flex-direction:column; gap:8px; position:relative; cursor:pointer; transition:.15s; min-height:140px;
  box-shadow:var(--shadow);
}
.card:hover{ transform:translateY(-2px); border-color:var(--muted-2); }
.card .card-top{ display:flex; align-items:flex-start; gap:8px; }
.card .cover{ font-size:18px; line-height:1; }
.card h3{ font-family:var(--font-display); font-size:14px; margin:0; font-weight:700; flex:1; line-height:1.3; }
.card .snippet{ font-size:12px; color:var(--muted); line-height:1.4; flex:1;
  display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
.card .pin-mark{ color:var(--accent); flex-shrink:0; }
.card .pin-mark svg{ width:14px; height:14px; }
.card .badgerow{ display:flex; gap:4px; flex-wrap:wrap; }
.badge{ font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:6px; background:var(--surface-2); color:var(--muted); }
.badge.cat{ background:var(--accent-soft); color:var(--accent-ink); }
.card .meta{ display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--muted-2); margin-top:auto; }
.card .meta svg{ width:11px; height:11px; }
.card .progress-track{ height:4px; border-radius:3px; background:var(--surface-2); overflow:hidden; }
.card .progress-fill{ height:100%; background:var(--teal); }
.card .actions{ position:absolute; top:8px; right:8px; display:flex; gap:3px; opacity:0; transition:.15s; }
.card:hover .actions{ opacity:1; }
.card .actions .iconbtn{ width:26px; height:26px; background:var(--surface); border:1px solid var(--border); }
.card .actions .iconbtn svg{ width:13px; height:13px; }
.card.locked{ background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 10px,var(--surface-2) 10px,var(--surface-2) 11px); }

.empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:50px 16px; color:var(--muted); text-align:center; gap:8px; }
.empty .emoji{ font-size:34px; }
.empty h3{ font-family:var(--font-display); color:var(--text); margin:0; font-size:17px; }
.empty p{ margin:0; font-size:12.5px; max-width:300px; }

/* ---------- Editor ---------- */
.editor-wrap{ max-width:800px; margin:0 auto; }
.editor-top{ display:flex; align-items:center; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
.editor-top .spacer{ flex:1; }
.title-input{
  width:100%; border:none; background:transparent; font-family:var(--font-display); font-size:24px; font-weight:800;
  margin-bottom:4px; color:var(--text);
}
.title-input::placeholder{ color:var(--muted-2); }
.content-textarea{
  width:100%; min-height:180px; border:none; background:transparent; font-size:14px; line-height:1.6; resize:vertical; color:var(--text);
}
.section{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px;
}
.section-head{ display:flex; align-items:center; gap:6px; margin-bottom:10px; }
.section-head h4{ font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:0; font-weight:700; }
.section-head .spacer{ flex:1; }

.checklist-item{ display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px dashed var(--border); }
.checklist-item:last-child{ border-bottom:none; }
.checklist-item input[type=checkbox]{ width:16px; height:16px; accent-color:var(--teal); flex-shrink:0; }
.checklist-item input[type=text]{ flex:1; border:none; font-size:13px; padding:3px 0; }
.checklist-item.done input[type=text]{ text-decoration:line-through; color:var(--muted-2); }
.add-row-inline{ display:flex; gap:6px; margin-top:8px; }
.add-row-inline input{ flex:1; border:1px solid var(--border); border-radius:7px; padding:6px 10px; font-size:12.5px; background:var(--surface-2); }

table.note-table{ border-collapse:collapse; width:100%; margin-bottom:6px; }
table.note-table td{ border:1px solid var(--border); padding:0; position:relative; }
table.note-table td input{ width:100%; padding:6px 8px; border:none; font-size:12.5px; background:transparent; }
table.note-table tr:first-child td input{ font-weight:700; background:var(--surface-2); }
.table-controls{ display:flex; gap:6px; }
.col-del{ position:absolute; top:-9px; right:2px; width:14px; height:14px; border-radius:50%; background:var(--danger); color:#fff;
  font-size:9px; display:flex; align-items:center; justify-content:center; border:none; opacity:0; }
table.note-table td:hover .col-del{ opacity:1; }

.metarow{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.select-field, .text-field{
  border:1px solid var(--border); background:var(--surface-2); border-radius:8px; padding:6px 10px; font-size:12px; color:var(--text);
}
.color-dots{ display:flex; gap:5px; flex-wrap:wrap; }
.color-dot{ width:22px; height:22px; border-radius:50%; border:2px solid transparent; cursor:pointer; }
.color-dot.selected{ border-color:var(--text); }
.cover-picks{ display:flex; gap:4px; flex-wrap:wrap; }
.cover-picks button{ width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:var(--surface-2); font-size:14px; }
.cover-picks button.selected{ border-color:var(--accent); background:var(--accent-soft); }
.tag-input-wrap{ display:flex; gap:4px; flex-wrap:wrap; align-items:center; border:1px solid var(--border); border-radius:8px; padding:5px 8px; background:var(--surface-2); }
.tag-pill{ display:flex; align-items:center; gap:4px; background:var(--teal-soft); color:var(--teal); font-size:11px; font-weight:700; padding:3px 7px; border-radius:6px; }
.tag-pill button{ background:none; border:none; color:var(--teal); font-weight:900; padding:0; }
.tag-input-wrap input{ border:none; flex:1; min-width:60px; font-size:12px; }

/* Focus mode */
.focus-active .sidebar, .focus-active .topbar, .focus-active .editor-top, .focus-active .section:not(.section-content){ display:none !important; }
.focus-active .content{ padding:40px 8%; }
.focus-active .editor-wrap{ max-width:650px; }
.focus-exit{ position:fixed; top:12px; right:16px; z-index:50; }

/* ---------- Snackbar ---------- */
.snackbar{
  position:fixed; bottom:86px; left:50%; transform:translateX(-50%) translateY(12px); background:var(--text); color:var(--bg);
  padding:10px 14px; border-radius:10px; display:flex; align-items:center; gap:10px; min-width:240px; max-width:min(92vw,380px); z-index:100;
  opacity:0; pointer-events:none; transition:transform .32s cubic-bezier(.22,1,.36,1), opacity .28s ease;
  box-shadow:0 10px 24px -8px rgba(0,0,0,.35);
}
.snackbar.show{ transform:translateX(-50%) translateY(0); opacity:1; pointer-events:auto; }
.snackbar .msg{ font-size:12.5px; flex:1; }
.snackbar .undo-btn{ background:none; border:none; color:var(--accent); font-weight:800; font-size:12px; }
.snackbar .progress{ position:absolute; bottom:0; left:0; height:2px; background:var(--accent); border-radius:0 0 10px 10px; width:100%; }

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,10,14,.5); display:flex; align-items:center; justify-content:center; z-index:200; padding:16px;
}
.modal{
  background:var(--surface); border-radius:14px; width:100%; max-width:420px; max-height:84vh; overflow-y:auto; padding:18px;
  box-shadow:var(--shadow); border:1px solid var(--border);
}
.modal.wide{ max-width:560px; }
.modal h3{ font-family:var(--font-display); margin:0 0 12px; font-size:16px; }
.modal-row{ margin-bottom:10px; }
.modal-row label{ display:block; font-size:11px; font-weight:700; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.3px; }
.modal-row input, .modal-row textarea, .modal-row select{
  width:100%; border:1px solid var(--border); background:var(--surface-2); border-radius:7px; padding:8px 10px; font-size:13px;
}
.modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
.category-row{ display:flex; align-items:center; gap:6px; padding:5px 0; border-bottom:1px solid var(--border); }
.category-row input{ flex:1; border:none; background:transparent; font-size:13px; padding:3px 0; }
.pin-dots{ display:flex; gap:10px; justify-content:center; margin:14px 0; }
.pin-dots .dot{ width:12px; height:12px; border-radius:50%; border:2px solid var(--muted-2); }
.pin-dots .dot.filled{ background:var(--accent); border-color:var(--accent); }
.keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.keypad button{ padding:12px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); font-size:16px; font-weight:700; }

/* ---------- Settings ---------- */
.settings-block{ max-width:520px; }
.setting-row{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
.setting-row:last-child{ border-bottom:none; }
.setting-row .info{ flex:1; }
.setting-row .info strong{ display:block; font-size:13px; margin-bottom:2px; }
.setting-row .info span{ font-size:11.5px; color:var(--muted); }
.switch{ width:40px; height:22px; border-radius:15px; background:var(--surface-2); border:1px solid var(--border); position:relative; flex-shrink:0; }
.switch.on{ background:var(--teal); border-color:var(--teal); }
.switch .knob{ position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:.15s; }
.switch.on .knob{ left:20px; }

/* Rules */
.rule-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.rule-card .rule-text{ font-size:12.5px; flex:1; }
.rule-card .rule-text b{ color:var(--teal); }

/* AI Capture */
.ai-hero{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.ai-hero .ring{
  width:40px; height:40px; border-radius:12px; background:linear-gradient(150deg,var(--teal),#0f5b55); display:flex;
  align-items:center; justify-content:center; color:#fff; flex-shrink:0; box-shadow:0 0 0 4px var(--teal-soft);
}
.ai-hero .ring svg{ width:20px; height:20px; }
.result-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; margin-top:14px; }

.small-muted{ font-size:11px; color:var(--muted); }
.divider{ height:1px; background:var(--border); margin:12px 0; }
.hidden{ display:none !important; }

/* ---------- Text overflow safety ---------- */
h1,h2,h3,h4,p,span,div,li,td,label,button,input,textarea{ overflow-wrap:break-word; word-break:break-word; }
.card, .section, .modal, .rule-card, .snackbar, .result-card, .banner, .badge, .chip, .tag-pill, .fab-item{ overflow-wrap:break-word; word-break:break-word; min-width:0; }
.card h3, .card .snippet, .rule-text, .msg, .info, .info strong, .info span{ min-width:0; overflow-wrap:break-word; word-break:break-word; }
.setting-row .info{ min-width:0; }
table.note-table{ table-layout:fixed; width:100%; }
table.note-table td{ word-break:break-word; overflow-wrap:break-word; }
table.note-table td input{ box-sizing:border-box; }
.content-textarea, .title-input{ box-sizing:border-box; max-width:100%; }
.topbar h1{ overflow-wrap:break-word; }

@media (max-width:720px){
  .fab{ width:48px; height:48px; bottom:16px; right:16px; }
  .fab-menu{ right:16px; bottom:72px; }
  .snackbar{ bottom:78px; min-width:0; width:92vw; }
  .topbar{ padding:10px; flex-wrap:wrap; }
  .content{ padding:12px; }
}
</style>
</head>
<body>
<div id="app">
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<button class="fab" id="fabToggle" title="মেনু">
  <svg id="fabIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
</button>
<div class="fab-backdrop" id="fabBackdrop"></div>
<div class="fab-menu" id="fabMenu">
  <button class="fab-item" data-screen="home"><span class="fi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span>হোম</button>
  <button class="fab-item" data-screen="ai"><span class="fi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg></span>AI ক্যাপচার</button>
  <button class="fab-item" data-screen="history"><span class="fi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l4 2"/></svg></span>ইতিহাস</button>
  <button class="fab-item" data-screen="rules"><span class="fi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h6"/><circle cx="19" cy="18" r="2"/></svg></span>রুলস</button>
  <button class="fab-item" data-screen="trash"><span class="fi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg></span>ট্র্যাশ</button>
  <button class="fab-item" data-screen="settings"><span class="fi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg></span>সেটিংস</button>
  <button class="fab-item" id="fabThemeItem"><span class="fi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>থিম</button>
</div>

<div id="snackbar" class="snackbar">
  <span class="msg" id="snackbarMsg"></span>
  <button class="undo-btn" id="undoBtn">ফিরিয়ে আনুন</button>
  <div class="progress" id="snackbarProgress"></div>
</div>

<div id="modalRoot"></div>

<script>
/* ============ localStorage Wrapper ============ */
window.storage = {
  async get(key) {
    const val = localStorage.getItem(key);
    return val ? { value: val } : null;
  },
  async set(key, value, stringify = true) {
    localStorage.setItem(key, stringify ? JSON.stringify(value) : value);
  }
};

/* ============ Utilities ============ */
const $ = (sel,root=document)=>root.querySelector(sel);
const $$ = (sel,root=document)=>Array.from(root.querySelectorAll(sel));
const uid = ()=> 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nowISO = ()=> new Date().toISOString();
function debounce(fn,wait){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),wait); }; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function timeAgo(iso){
  if(!iso) return '';
  const diff = (Date.now()-new Date(iso).getTime())/1000;
  if(diff<60) return 'এইমাত্র';
  if(diff<3600) return Math.floor(diff/60)+' মি.';
  if(diff<86400) return Math.floor(diff/3600)+' ঘ.';
  if(diff<86400*30) return Math.floor(diff/86400)+' দিন';
  return new Date(iso).toLocaleDateString('bn-BD');
}
function fmtDateTime(iso){ return iso? new Date(iso).toLocaleString('bn-BD'): ''; }

const COLORS = ['#FFFFFF','#FDE7C9','#FCE0DE','#E3F1DE','#DDEBFB','#EAE1F7','#F7E1EE','#232735'];
const COVERS = ['📝','💡','📌','✅','📚','💼','🎯','❤️','🎵','🍀','⏰','🔒'];

/* ============ State ============ */
let state = {
  notes: [],
  categories: ['ব্যক্তিগত','কাজ','পড়াশোনা','ধারণা'],
  rules: [],
  settings: { theme:'light', aiEnabled:false, apiKey:'', modelName:'gemini-2.0-flash' },
};
let screen = 'home';
let searchQuery = '';
let homeFilter = 'all';
let categoryFilter = null;
let editingNoteId = null;
let viewingNoteId = null;
let editorOrigin = 'home';
let unlockedNoteIds = new Set();
let focusMode = false;
let pendingDelete = null;
let historyPickedNoteId = null;
let aiResult = null;

/* ============ Storage ============ */
async function loadAll(){
  try{ const r = await window.storage.get('notes-data'); if(r) state.notes = JSON.parse(r.value).notes || []; }catch(e){}
  try{ const r = await window.storage.get('categories-data'); if(r) state.categories = JSON.parse(r.value).categories || state.categories; }catch(e){}
  try{ const r = await window.storage.get('rules-data'); if(r) state.rules = JSON.parse(r.value).rules || []; }catch(e){}
  try{ const r = await window.storage.get('settings-data'); if(r) state.settings = Object.assign(state.settings, JSON.parse(r.value)); }catch(e){}
  applyTheme();
}
const saveNotes = debounce(async ()=>{ try{ await window.storage.set('notes-data', JSON.stringify({notes:state.notes}), false); }catch(e){ console.error(e); } }, 350);
async function saveCategories(){ try{ await window.storage.set('categories-data', JSON.stringify({categories:state.categories}), false); }catch(e){} }
async function saveRules(){ try{ await window.storage.set('rules-data', JSON.stringify({rules:state.rules}), false); }catch(e){} }
async function saveSettings(){ try{ await window.storage.set('settings-data', JSON.stringify(state.settings), false); }catch(e){} }

function applyTheme(){ document.body.setAttribute('data-theme', state.settings.theme); }

/* ============ Note helpers ============ */
function getNote(id){ return state.notes.find(n=>n.id===id); }
function activeNotes(){ return state.notes.filter(n=>!n.trashed && !n.pendingDelete); }
function visibleNotes(){
  let list = activeNotes();
  if(homeFilter==='pinned') list = list.filter(n=>n.pinned && !n.archived);
  else if(homeFilter==='archived') list = list.filter(n=>n.archived);
  else list = list.filter(n=>!n.archived);
  if(categoryFilter) list = list.filter(n=>n.category===categoryFilter);
  if(searchQuery.trim()){
    const q = searchQuery.trim().toLowerCase();
    list = list.filter(n => (n.title||'').toLowerCase().includes(q) || (n.content||'').toLowerCase().includes(q) || (n.tags||[]).some(t=>t.toLowerCase().includes(q)));
  }
  list.sort((a,b)=>{
    if(!!b.pinned - !!a.pinned !== 0) return !!b.pinned - !!a.pinned;
    return new Date(b.updatedAt) - new Date(a.updatedAt);
  });
  return list;
}
function newNoteObj(){
  return {
    id: uid(), title:'', content:'', checklist:null, table:null,
    category:'সাধারণ', tags:[], color:'#FFFFFF', cover:'📝',
    pinned:false, locked:false, pin:'',
    expiry:null, archived:false, trashed:false, trashedAt:null, pendingDelete:false,
    createdAt: nowISO(), updatedAt: nowISO(), history:[]
  };
}
function applySmartSortRules(note){
  for(const rule of state.rules){
    if(!rule.enabled) continue;
    if((note.tags||[]).includes(rule.tag)){ note.category = rule.category; break; }
  }
}
function pushHistory(note){
  note.history = note.history || [];
  note.history.unshift({ title:note.title, content:note.content, checklist:note.checklist? JSON.parse(JSON.stringify(note.checklist)):null, table:note.table? JSON.parse(JSON.stringify(note.table)):null, timestamp: nowISO() });
  if(note.history.length>20) note.history.length = 20;
}
function checkExpiries(){
  let changed = false;
  state.notes.forEach(n=>{
    if(n.expiry && !n.archived && !n.trashed && new Date(n.expiry).getTime() <= Date.now()){ n.archived = true; changed = true; }
  });
  if(changed) saveNotes();
}
function idleSuggestions(){
  const MS = 14*24*3600*1000;
  return activeNotes().filter(n=> !n.archived && (Date.now()-new Date(n.updatedAt).getTime()) > MS);
}

/* ============ Rendering: shell ============ */
function render(){
  $$('.fab-item[data-screen]').forEach(b=> b.classList.toggle('active', b.dataset.screen===screen));
  document.body.classList.toggle('focus-active', focusMode);
  renderTopbar();
  renderContent();
}

function renderTopbar(){
  const tb = $('#topbar');
  if(screen==='home'){
    tb.innerHTML = `
      <span class="brandmark"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="currentColor"/></svg></span>
      <h1>Power_Notes</h1>
      <div class="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" placeholder="খুঁজুন..." value="${escapeHtml(searchQuery)}">
      </div>
      <div class="spacer"></div>
      <button class="btn ghost" id="manageCatsBtn">🏷️ ক্যাটাগরি</button>
      <button class="btn primary" id="newNoteBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
        নতুন
      </button>`;
    $('#searchInput').oninput = e=>{ searchQuery = e.target.value; renderContent(); };
    $('#newNoteBtn').onclick = ()=> openEditor(null);
    $('#manageCatsBtn').onclick = openCategoryModal;
  } else if(screen==='editor'){
    tb.innerHTML = `<span class="brandmark"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="currentColor"/></svg></span><h1>এডিটর</h1>`;
  } else if(screen==='view'){
    tb.innerHTML = `<span class="brandmark"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="currentColor"/></svg></span><h1>নোট</h1>`;
  } else {
    const titles = { ai:'AI ক্যাপচার', history:'ইতিহাস', rules:'রুলস', trash:'ট্র্যাশ', settings:'সেটিংস' };
    tb.innerHTML = `<span class="brandmark"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="currentColor"/></svg></span><h1>${titles[screen]||''}</h1>`;
  }
}

function renderContent(){
  const c = $('#content');
  if(screen==='home') c.innerHTML = homeHTML();
  else if(screen==='view') c.innerHTML = viewHTML();
  else if(screen==='editor') c.innerHTML = editorHTML();
  else if(screen==='ai') c.innerHTML = aiHTML();
  else if(screen==='history') c.innerHTML = historyHTML();
  else if(screen==='rules') c.innerHTML = rulesHTML();
  else if(screen==='trash') c.innerHTML = trashHTML();
  else if(screen==='settings') c.innerHTML = settingsHTML();
  bindScreenEvents();
}

/* ============ HOME ============ */
function homeHTML(){
  const suggestions = idleSuggestions();
  const list = visibleNotes();
  let html = '';
  if(suggestions.length && homeFilter==='all' && !window.__dismissIdle){
    html += `<div class="banner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12A8 8 0 1 1 4 12a8 8 0 0 1 16 0Z"/><path d="M12 8v4l3 2"/></svg>
      <span>${suggestions.length}টি নোট পুরনো — আর্কাইভ করুন?</span>
      <div class="spacer"></div>
      <button class="btn sm teal" id="archiveIdleBtn">আর্কাইভ</button>
      <button class="btn sm ghost" id="dismissIdleBtn">বাদ দিন</button>
    </div>`;
  }
  html += `<div class="tabs">
      <button class="tab ${homeFilter==='all'?'active':''}" data-filter="all">সব</button>
      <button class="tab ${homeFilter==='pinned'?'active':''}" data-filter="pinned">পিন</button>
      <button class="tab ${homeFilter==='archived'?'active':''}" data-filter="archived">আর্কাইভ</button>
    </div>`;
  html += `<div class="chiprow" id="catChipRow">
      <button class="chip ${!categoryFilter?'active':''}" data-cat="">সব</button>
      ${state.categories.map(c=>`<button class="chip ${categoryFilter===c?'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('')}
    </div>`;

  if(!list.length){
    html += `<div class="empty">
      <div class="emoji">🗒️</div>
      <h3>কোনো নোট নেই</h3>
      <p>নতুন নোট বা AI ক্যাপচার ব্যবহার করুন।</p>
      <button class="btn primary" id="emptyNewBtn" style="margin-top:4px;">+ নতুন</button>
    </div>`;
  } else {
    html += `<div class="grid">${list.map(noteCardHTML).join('')}</div>`;
  }
  return html;
}

function noteCardHTML(n){
  const checklistProgress = n.checklist && n.checklist.length ? Math.round(100*n.checklist.filter(i=>i.done).length/n.checklist.length) : null;
  const expiryBadge = n.expiry ? `<span class="badge">⏳ ${new Date(n.expiry).toLocaleDateString('bn-BD')}</span>` : '';
  return `
  <div class="card ${n.locked?'locked':''}" style="background:${n.color||'var(--surface)'}" data-id="${n.id}">
    <div class="actions">
      <button class="iconbtn" data-act="pin" title="পিন"><svg viewBox="0 0 24 24" fill="${n.pinned?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 17v5M8 3h8l-1 6 3 3H6l3-3-1-6Z"/></svg></button>
      <button class="iconbtn" data-act="more" title="আরও"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
      <button class="iconbtn" data-act="del" title="মুছুন"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg></button>
    </div>
    <div class="card-top">
      <div class="cover">${n.locked?'🔒':(n.cover||'📝')}</div>
      <h3>${escapeHtml(n.title)||'শিরোনামহীন'}</h3>
    </div>
    ${n.locked? '<div class="snippet">লক করা নোট</div>' : `<div class="snippet">${escapeHtml(n.content).slice(0,200)}</div>`}
    ${checklistProgress!==null && !n.locked ? `<div class="progress-track"><div class="progress-fill" style="width:${checklistProgress}%"></div></div>` : ''}
    <div class="badgerow">
      <span class="badge cat">${escapeHtml(n.category)}</span>
      ${(n.tags||[]).slice(0,3).map(t=>`<span class="badge">#${escapeHtml(t)}</span>`).join('')}
      ${expiryBadge}
      ${n.archived? '<span class="badge">📦</span>':''}
    </div>
    <div class="meta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>
      ${timeAgo(n.updatedAt)}
    </div>
  </div>`;
}

/* ============ EDITOR ============ */
function editorHTML(){
  const n = getNote(editingNoteId);
  if(!n) return '<div class="empty"><p>নোট পাওয়া যায়নি।</p></div>';
  if(n.locked && !unlockedNoteIds.has(n.id)){
    openPinModal(n.id, 'unlock');
    return '<div class="empty"><div class="emoji">🔒</div><h3>লক করা</h3><p>PIN দিয়ে আনলক করুন।</p></div>';
  }
  return `
  <div class="editor-wrap">
    <div class="editor-top">
      <button class="btn ghost" id="backBtn">← ফিরুন</button>
      <div class="spacer"></div>
      <button class="btn ghost" id="focusBtn" title="Focus Mode">🎯 ফোকাস</button>
      <button class="btn ghost" id="historyBtn" title="ইতিহাস">🕘</button>
      <button class="btn ghost" id="moreEditBtn">⋯</button>
      <button class="btn primary" id="saveNoteBtn">✓ সংরক্ষণ</button>
    </div>

    <button class="btn ghost focus-exit hidden" id="focusExitBtn">✕ ফোকাস বন্ধ</button>

    <div class="section section-content" style="background:${n.color||'var(--surface)'}">
      <input class="title-input" id="titleInput" placeholder="শিরোনাম..." value="${escapeHtml(n.title)}">
      <textarea class="content-textarea" id="contentInput" placeholder="লিখুন...">${escapeHtml(n.content)}</textarea>
    </div>

    <div class="section">
      <div class="metarow">
        <select class="select-field" id="categorySelect">
          ${state.categories.map(c=>`<option value="${escapeHtml(c)}" ${n.category===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}
        </select>
        <div class="tag-input-wrap" id="tagWrap">
          ${(n.tags||[]).map(t=>`<span class="tag-pill">#${escapeHtml(t)}<button data-tag="${escapeHtml(t)}">×</button></span>`).join('')}
          <input id="tagInput" placeholder="ট্যাগ যোগ করুন">
        </div>
      </div>
      <div class="divider"></div>
      <div class="metarow">
        <span class="small-muted">রঙ:</span>
        <div class="color-dots">${COLORS.map(c=>`<div class="color-dot ${n.color===c?'selected':''}" style="background:${c};border:1px solid var(--border)" data-color="${c}"></div>`).join('')}</div>
      </div>
      <div class="divider"></div>
      <div class="metarow">
        <span class="small-muted">আইকন:</span>
        <div class="cover-picks">${COVERS.map(c=>`<button class="${n.cover===c?'selected':''}" data-cover="${c}">${c}</button>`).join('')}</div>
      </div>
      <div class="divider"></div>
      <div class="metarow">
        <span class="small-muted">মেয়াদ:</span>
        <input type="datetime-local" class="text-field" id="expiryInput" value="${n.expiry? n.expiry.slice(0,16):''}">
        ${n.expiry? '<button class="btn sm ghost" id="clearExpiryBtn">মুছুন</button>' : ''}
      </div>
    </div>

    <div class="section">
      <div class="section-head"><h4>চেকলিস্ট</h4><div class="spacer"></div>
        ${n.checklist? '<button class="btn sm ghost" id="removeChecklistBtn">অপসারণ</button>' : '<button class="btn sm ghost" id="addChecklistBtn">+ যোগ</button>'}
      </div>
      ${n.checklist? checklistHTML(n): '<p class="small-muted">চেকলিস্ট নেই</p>'}
    </div>

    <div class="section">
      <div class="section-head"><h4>টেবিল</h4><div class="spacer"></div>
        ${n.table? '<button class="btn sm ghost" id="removeTableBtn">অপসারণ</button>' : '<button class="btn sm ghost" id="addTableBtn">+ যোগ</button>'}
      </div>
      ${n.table? tableHTML(n): '<p class="small-muted">টেবিল নেই</p>'}
    </div>

    <div class="section">
      <div class="metarow">
        <button class="btn ghost" id="lockToggleBtn">${n.locked? '🔓 আনলক' : '🔒 লক'}</button>
        <span class="small-muted">পরিবর্তন: ${fmtDateTime(n.updatedAt)}</span>
      </div>
    </div>
  </div>`;
}

function checklistHTML(n){
  return `
    ${n.checklist.map(item=>`
      <div class="checklist-item ${item.done?'done':''}" data-item="${item.id}">
        <input type="checkbox" ${item.done?'checked':''} data-check="${item.id}">
        <input type="text" value="${escapeHtml(item.text)}" data-checktext="${item.id}" placeholder="আইটেম">
        <button class="iconbtn" data-checkdel="${item.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>`).join('')}
    <div class="add-row-inline">
      <input id="newChecklistItem" placeholder="নতুন আইটেম">
      <button class="btn sm teal" id="addChecklistItemBtn">+</button>
    </div>`;
}

function tableHTML(n){
  const rows = n.table.rows;
  let html = `<div class="table-controls" style="margin-bottom:8px;">
      <button class="btn sm ghost" id="addRowBtn">+ সারি</button>
      <button class="btn sm ghost" id="addColBtn">+ কলাম</button>
    </div>
    <div style="overflow-x:auto;"><table class="note-table"><tbody>`;
  rows.forEach((row,ri)=>{
    html += '<tr>';
    row.forEach((cell,ci)=>{
      html += `<td data-r="${ri}" data-c="${ci}">
        <input type="text" value="${escapeHtml(cell)}" data-cell="${ri}-${ci}">
        ${ri===0 && rows.length>1 ? `<button class="col-del" data-delcol="${ci}">×</button>` : ''}
      </td>`;
    });
    html += `<td style="border:none;width:24px;">${rows.length>1?`<button class="iconbtn" data-delrow="${ri}" style="width:22px;height:22px;">✕</button>`:''}</td></tr>`;
  });
  html += '</tbody></table></div>';
  return html;
}

/* ============ VIEW ============ */
function viewHTML(){
  const n = getNote(viewingNoteId);
  if(!n) return '<div class="empty"><p>নোট নেই।</p></div>';
  if(n.locked && !unlockedNoteIds.has(n.id)){
    openPinModal(n.id, 'unlock');
    return '<div class="empty"><div class="emoji">🔒</div><h3>লক করা</h3><p>PIN দিন।</p></div>';
  }
  const checklistProgress = n.checklist && n.checklist.length ? Math.round(100*n.checklist.filter(i=>i.done).length/n.checklist.length) : null;
  return `
  <div class="editor-wrap">
    <div class="editor-top">
      <button class="btn ghost" id="viewBackBtn">← ফিরুন</button>
      <div class="spacer"></div>
      <button class="btn ghost" id="viewMoreBtn">⋯</button>
      <button class="btn ghost" id="viewDelBtn">🗑️</button>

/* ============ Screen open helpers ============ */
function openEditor(id, origin){
  if(id){ editingNoteId = id; }
  else {
    const n = newNoteObj();
    state.notes.unshift(n);
    editingNoteId = n.id;
    saveNotes();
  }
  editorOrigin = origin || 'home';
  screen = 'editor'; focusMode = false; render();
}
function openView(id){
  viewingNoteId = id; screen = 'view'; focusMode = false; render();
}

/* ============ Event binding per screen ============ */
function bindScreenEvents(){
  if(screen==='home') bindHome();
  else if(screen==='view') bindView();
  else if(screen==='editor') bindEditor();
  else if(screen==='ai') bindAI();
  else if(screen==='history') bindHistory();
  else if(screen==='rules') bindRules();
  else if(screen==='trash') bindTrash();
  else if(screen==='settings') bindSettings();
}

function bindHome(){
  $$('.tab').forEach(t=> t.onclick = ()=>{ homeFilter = t.dataset.filter; renderContent(); });
  $$('#catChipRow .chip').forEach(c=> c.onclick = ()=>{ categoryFilter = c.dataset.cat || null; renderContent(); });
  const idleBtn = $('#archiveIdleBtn'); if(idleBtn) idleBtn.onclick = ()=>{ idleSuggestions().forEach(n=>n.archived=true); saveNotes(); renderContent(); };
  const dismissBtn = $('#dismissIdleBtn'); if(dismissBtn) dismissBtn.onclick = ()=>{ window.__dismissIdle = true; renderContent(); };
  const emptyBtn = $('#emptyNewBtn'); if(emptyBtn) emptyBtn.onclick = ()=> openEditor(null);
  $$('.card').forEach(card=>{
    const id = card.dataset.id;
    card.onclick = (e)=>{ if(e.target.closest('.actions')) return; const n=getNote(id); if(n.locked && !unlockedNoteIds.has(id)){ screen='view'; viewingNoteId=id; openPinModal(id,'unlock'); } else { openView(id); } };
    const pinBtn = card.querySelector('[data-act="pin"]'); if(pinBtn) pinBtn.onclick=(e)=>{ e.stopPropagation(); const n=getNote(id); n.pinned=!n.pinned; n.updatedAt=nowISO(); saveNotes(); renderContent(); };
    const moreBtn = card.querySelector('[data-act="more"]'); if(moreBtn) moreBtn.onclick=(e)=>{ e.stopPropagation(); openMoreMenu(id, e.currentTarget); };
    const delBtn = card.querySelector('[data-act="del"]'); if(delBtn) delBtn.onclick=(e)=>{ e.stopPropagation(); requestDelete(id); };
  });
}

function bindEditor(){
  const n = getNote(editingNoteId); if(!n) return;
  const back = $('#backBtn'); if(back) back.onclick = ()=>{ if(editorOrigin==='view'){ openView(n.id); } else { screen='home'; render(); } };
  const saveBtn = $('#saveNoteBtn'); if(saveBtn) saveBtn.onclick = ()=>{
    pushHistory(n); applySmartSortRules(n); n.updatedAt = nowISO(); saveNotes(); toast('সংরক্ষিত ✓'); openView(n.id);
  };
  const focusBtn = $('#focusBtn'); if(focusBtn) focusBtn.onclick = ()=>{ focusMode=true; document.body.classList.add('focus-active'); $('#focusExitBtn').classList.remove('hidden'); };
  const focusExit = $('#focusExitBtn'); if(focusExit) focusExit.onclick = ()=>{ focusMode=false; document.body.classList.remove('focus-active'); focusExit.classList.add('hidden'); };
  const historyBtn = $('#historyBtn'); if(historyBtn) historyBtn.onclick = ()=>{ historyPickedNoteId = n.id; screen='history'; render(); };
  const moreBtn = $('#moreEditBtn'); if(moreBtn) moreBtn.onclick = (e)=> openMoreMenu(n.id, e.currentTarget);

  const titleI = $('#titleInput'); if(titleI) titleI.oninput = debounce(()=>{ n.title = titleI.value; n.updatedAt=nowISO(); saveNotes(); },400);
  const contentI = $('#contentInput'); if(contentI) contentI.oninput = debounce(()=>{ n.content = contentI.value; n.updatedAt=nowISO(); saveNotes(); },400);
  const catSel = $('#categorySelect'); if(catSel) catSel.onchange = ()=>{ n.category = catSel.value; n.updatedAt=nowISO(); saveNotes(); };

  const tagInput = $('#tagInput');
  if(tagInput) tagInput.onkeydown = (e)=>{
    if(e.key==='Enter' && tagInput.value.trim()){
      e.preventDefault(); n.tags = n.tags||[]; const v=tagInput.value.trim();
      if(!n.tags.includes(v)) n.tags.push(v);
      n.updatedAt=nowISO(); saveNotes(); renderContent();
    }
  };
  $$('#tagWrap .tag-pill button').forEach(b=> b.onclick = ()=>{ n.tags = n.tags.filter(t=>t!==b.dataset.tag); saveNotes(); renderContent(); });

  $$('.color-dot').forEach(d=> d.onclick = ()=>{ n.color = d.dataset.color; n.updatedAt=nowISO(); saveNotes(); renderContent(); });
  $$('.cover-picks button').forEach(b=> b.onclick = ()=>{ n.cover = b.dataset.cover; n.updatedAt=nowISO(); saveNotes(); renderContent(); });

  const expiryI = $('#expiryInput'); if(expiryI) expiryI.onchange = ()=>{ n.expiry = expiryI.value? new Date(expiryI.value).toISOString() : null; saveNotes(); renderContent(); };
  const clearExp = $('#clearExpiryBtn'); if(clearExp) clearExp.onclick = ()=>{ n.expiry=null; saveNotes(); renderContent(); };

  const addChecklistBtn = $('#addChecklistBtn'); if(addChecklistBtn) addChecklistBtn.onclick = ()=>{ n.checklist=[]; saveNotes(); renderContent(); };
  const removeChecklistBtn = $('#removeChecklistBtn'); if(removeChecklistBtn) removeChecklistBtn.onclick = ()=>{ n.checklist=null; saveNotes(); renderContent(); };
  const newItemInput = $('#newChecklistItem');
  const addItemFn = ()=>{ if(newItemInput.value.trim()){ n.checklist.push({id:uid(),text:newItemInput.value.trim(),done:false}); saveNotes(); renderContent(); } };
  if(newItemInput) newItemInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addItemFn(); } };
  const addChecklistItemBtn = $('#addChecklistItemBtn'); if(addChecklistItemBtn) addChecklistItemBtn.onclick = addItemFn;
  $$('[data-check]').forEach(cb=> cb.onchange = ()=>{ const item=n.checklist.find(i=>i.id===cb.dataset.check); item.done=cb.checked; saveNotes(); renderContent(); });
  $$('[data-checktext]').forEach(inp=> inp.oninput = debounce(()=>{ const item=n.checklist.find(i=>i.id===inp.dataset.checktext); item.text=inp.value; saveNotes(); },300));
  $$('[data-checkdel]').forEach(b=> b.onclick = ()=>{ n.checklist = n.checklist.filter(i=>i.id!==b.dataset.checkdel); saveNotes(); renderContent(); });

  const addTableBtn = $('#addTableBtn'); if(addTableBtn) addTableBtn.onclick = ()=>{ n.table = { rows:[['কলাম ১','কলাম ২'],['','']] }; saveNotes(); renderContent(); };
  const removeTableBtn = $('#removeTableBtn'); if(removeTableBtn) removeTableBtn.onclick = ()=>{ n.table=null; saveNotes(); renderContent(); };
  const addRowBtn = $('#addRowBtn'); if(addRowBtn) addRowBtn.onclick = ()=>{ n.table.rows.push(n.table.rows[0].map(()=>'')); saveNotes(); renderContent(); };
  const addColBtn = $('#addColBtn'); if(addColBtn) addColBtn.onclick = ()=>{ n.table.rows.forEach(r=>r.push('')); saveNotes(); renderContent(); };
  $$('[data-delrow]').forEach(b=> b.onclick = ()=>{ n.table.rows.splice(Number(b.dataset.delrow),1); saveNotes(); renderContent(); });
  $$('[data-delcol]').forEach(b=> b.onclick = ()=>{ const c=Number(b.dataset.delcol); n.table.rows.forEach(r=>r.splice(c,1)); saveNotes(); renderContent(); });
  $$('[data-cell]').forEach(inp=> inp.oninput = debounce(()=>{ const [r,c]=inp.dataset.cell.split('-').map(Number); n.table.rows[r][c]=inp.value; saveNotes(); },300));

  const lockToggleBtn = $('#lockToggleBtn'); if(lockToggleBtn) lockToggleBtn.onclick = ()=>{
    if(n.locked){ openPinModal(n.id,'remove'); } else { openPinModal(n.id,'set'); }
  };
}

function bindView(){
  const n = getNote(viewingNoteId); if(!n) return;
  const back = $('#viewBackBtn'); if(back) back.onclick = ()=>{ screen='home'; render(); };
  const editBtn = $('#viewEditBtn'); if(editBtn) editBtn.onclick = ()=> openEditor(n.id, 'view');
  const moreBtn = $('#viewMoreBtn'); if(moreBtn) moreBtn.onclick = (e)=> openMoreMenu(n.id, e.currentTarget);
  const delBtn = $('#viewDelBtn'); if(delBtn) delBtn.onclick = ()=>{ screen='home'; render(); requestDelete(n.id); };
  $$('[data-viewcheck]').forEach(cb=> cb.onchange = ()=>{ const item=n.checklist.find(i=>i.id===cb.dataset.viewcheck); item.done=cb.checked; n.updatedAt=nowISO(); saveNotes(); renderContent(); });
}

function bindAI(){
  const goSettings = $('#goSettingsBtn'); if(goSettings) goSettings.onclick = ()=>{ screen='settings'; render(); };
  const processBtn = $('#processAiBtn');
  if(processBtn) processBtn.onclick = async ()=>{
    const raw = $('#aiRawInput').value.trim();
    if(!raw){ toast('লিখুন'); return; }
    const statusEl = $('#aiStatus'); statusEl.textContent = 'প্রসেস...';
    processBtn.disabled = true;
    try{
      const result = await runAIQuickCapture(raw);
      aiResult = result;
      $('#aiResultZone').innerHTML = aiResultHTML(result);
      bindAIResult();
      statusEl.textContent = 'সম্পন্ন ✓';
    }catch(err){
      statusEl.textContent = 'ত্রুটি: '+err.message;
    }
    processBtn.disabled = false;
  };
}
function bindAIResult(){
  const saveBtn = $('#saveAiNoteBtn');
  if(saveBtn) saveBtn.onclick = ()=>{
    const n = newNoteObj();
    n.title = $('#aiTitle').value;
    n.content = $('#aiContent').value;
    n.category = $('#aiCategory').value;
    n.tags = $('#aiTags').value.split(',').map(t=>t.trim()).filter(Boolean);
    if(aiResult.checklist && aiResult.checklist.length) n.checklist = aiResult.checklist.map(t=>({id:uid(),text:t,done:false}));
    applySmartSortRules(n);
    state.notes.unshift(n); saveNotes();
    toast('সংরক্ষিত ✓');
    openView(n.id);
  };
}

function bindHistory(){
  const sel = $('#historyNoteSelect'); if(sel) sel.onchange = ()=>{ historyPickedNoteId = sel.value || null; renderContent(); };
  $$('[data-restore]').forEach(b=> b.onclick = ()=>{
    const n = getNote(historyPickedNoteId); const h = n.history[Number(b.dataset.restore)];
    n.title=h.title; n.content=h.content; n.checklist=h.checklist; n.table=h.table; n.updatedAt=nowISO();
    saveNotes(); toast('ফিরিয়ে আনা হয়েছে'); openView(n.id);
  });
}

function bindRules(){
  const addBtn = $('#addRuleBtn'); if(addBtn) addBtn.onclick = openRuleModal;
  $$('[data-toggle-rule]').forEach(s=> s.onclick = ()=>{ const r = state.rules.find(x=>x.id===s.dataset.toggleRule); r.enabled=!r.enabled; saveRules(); renderContent(); });
  $$('[data-del-rule]').forEach(b=> b.onclick = ()=>{ state.rules = state.rules.filter(r=>r.id!==b.dataset.delRule); saveRules(); renderContent(); });
}

function bindTrash(){
  $$('[data-restore-trash]').forEach(b=> b.onclick = ()=>{ const n=getNote(b.dataset.restoreTrash); n.trashed=false; n.trashedAt=null; saveNotes(); renderContent(); toast('পুনরুদ্ধার করা হয়েছে'); });
  $$('[data-perm-del]').forEach(b=> b.onclick = ()=>{ if(confirm('স্থায়ীভাবে মুছবেন?')){ state.notes = state.notes.filter(n=>n.id!==b.dataset.permDel); saveNotes(); renderContent(); } });
}

function bindSettings(){
  const aiSwitch = $('#aiToggleSwitch'); if(aiSwitch) aiSwitch.onclick = ()=>{ state.settings.aiEnabled = !state.settings.aiEnabled; saveSettings(); renderContent(); };
  const saveAiBtn = $('#saveAiSettingsBtn'); if(saveAiBtn) saveAiBtn.onclick = ()=>{
    state.settings.apiKey = $('#apiKeyInput').value.trim();
    state.settings.modelName = $('#modelNameInput').value.trim() || 'gemini-2.0-flash';
    saveSettings(); toast('সেটিংস সংরক্ষিত ✓');
  };
  const testBtn = $('#testConnBtn'); if(testBtn) testBtn.onclick = async ()=>{
    const statusEl = $('#testConnStatus'); statusEl.textContent = 'টেস্ট...';
    const apiKey = $('#apiKeyInput').value.trim(); const model = $('#modelNameInput').value.trim() || 'gemini-2.0-flash';
    try{
      const text = await callGemini(apiKey, model, "শুধু 'OK' লিখুন।");
      statusEl.textContent = '✓ সফল: ' + text.slice(0,30);
    }catch(err){ statusEl.textContent = '✗ ব্যর্থ: '+err.message; }
  };
  const openCatBtn = $('#openCatMgrBtn'); if(openCatBtn) openCatBtn.onclick = openCategoryModal;
}

/* ============ AI calls ============ */
async function callGemini(apiKey, model, prompt){
  if(!apiKey) throw new Error('API Key নেই');
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ contents:[{ parts:[{ text: prompt }] }] }) });
  if(!res.ok){ const t = await res.text().catch(()=>String(res.status)); throw new Error('HTTP '+res.status+' — '+t.slice(0,120)); }
  const data = await res.json();
  const text = data?.candidates?.[0]?.content?.parts?.map(p=>p.text).join('\n') || '';
  if(!text) throw new Error('খালি উত্তর');
  return text;
}
async function runAIQuickCapture(rawText){
  const s = state.settings;
  const prompt = `নিচের কাঁচা নোট থেকে তথ্য বের করে শুধুমাত্র বিশুদ্ধ JSON আকারে উত্তর দাও। কোনো ব্যাখ্যা, কোনো কোড ফেন্স (\`\`\`) বা অতিরিক্ত লেখা দিও না — শুধু JSON।
বিদ্যমান ক্যাটাগরিসমূহ: ${state.categories.join(', ')}
JSON ফরম্যাট:
{"title": "সংক্ষিপ্ত শিরোনাম", "content": "সুন্দরভাবে গুছিয়ে ফরম্যাট করা টেক্সট", "checklist": ["আইটেম১","আইটেম২"], "category": "উপরের তালিকা থেকে একটি অথবা নতুন প্রস্তাবিত", "tags": ["ট্যাগ১","ট্যাগ২"], "actionItems": ["গুরুত্বপূর্ণ কাজ১"]}

মূল নোট:
"""
${rawText}
"""`;
  const text = await callGemini(s.apiKey, s.modelName, prompt);
  const cleaned = text.replace(/```json|```/g,'').trim();
  let parsed;
  try{ parsed = JSON.parse(cleaned); }
  catch(e){ throw new Error('সঠিক JSON পাওয়া যায়নি'); }
  if(!state.categories.includes(parsed.category)) state.categories.push(parsed.category), saveCategories();
  return parsed;
}

/* ============ Delete / Undo ============ */
function requestDelete(id){
  const n = getNote(id); if(!n) return;
  n.pendingDelete = true; renderContent();
  showSnackbar('মুছে ফেলা হচ্ছে...', ()=>{ n.pendingDelete = false; saveNotes(); renderContent(); toast('বাতিল'); }, ()=>{
    n.pendingDelete = false; n.trashed = true; n.trashedAt = nowISO(); saveNotes(); renderContent();
  });
}
let snackTimer=null, snackAction=null;
function showSnackbar(msg, onUndo, onComplete){
  clearTimeout(snackTimer);
  const sb = $('#snackbar'); const prog = $('#snackbarProgress');
  $('#snackbarMsg').textContent = msg;
  sb.classList.add('show');
  prog.style.transition='none'; prog.style.width='100%';
  requestAnimationFrame(()=>{ prog.style.transition='width 3s linear'; prog.style.width='0%'; });
  snackAction = onUndo;
  $('#undoBtn').onclick = ()=>{ clearTimeout(snackTimer); sb.classList.remove('show'); if(snackAction) snackAction(); };
  snackTimer = setTimeout(()=>{ sb.classList.remove('show'); if(onComplete) onComplete(); }, 3000);
}
function toast(msg){
  const sb = $('#snackbar'); $('#snackbarMsg').textContent = msg; $('#undoBtn').style.visibility='hidden';
  $('#snackbarProgress').style.width='0%'; sb.classList.add('show');
  setTimeout(()=>{ sb.classList.remove('show'); $('#undoBtn').style.visibility='visible'; }, 1800);
}

/* ============ Modals ============ */
function closeModal(){ $('#modalRoot').innerHTML=''; }
function openMoreMenu(id, anchor){
  const n = getNote(id);
  $('#modalRoot').innerHTML = `
  <div class="modal-overlay" id="ovl">
    <div class="modal">
      <h3>${escapeHtml(n.title)||'নোট অপশন'}</h3>
      <div class="metarow" style="flex-direction:column;align-items:stretch;gap:6px;">
        <button class="btn ghost" id="dupBtn">📄 ডুপ্লিকেট</button>
        <button class="btn ghost" id="editBtn">✎ এডিট</button>
        <button class="btn ghost" id="archBtn">${n.archived?'📤 আর্কাইভ থেকে বের': '📦 আর্কাইভ'}</button>
        <button class="btn danger" id="delModalBtn">🗑️ মুছুন</button>
      </div>
      <div class="modal-actions"><button class="btn ghost" id="closeModalBtn">বন্ধ</button></div>
    </div>
  </div>`;
  $('#ovl').onclick = (e)=>{ if(e.target.id==='ovl') closeModal(); };
  $('#closeModalBtn').onclick = closeModal;
  $('#dupBtn').onclick = ()=>{ const copy = JSON.parse(JSON.stringify(n)); copy.id=uid(); copy.title=(n.title||'শিরোনামহীন')+' (কপি)'; copy.createdAt=nowISO(); copy.updatedAt=nowISO(); state.notes.unshift(copy); saveNotes(); closeModal(); renderContent(); };
  $('#editBtn').onclick = ()=>{ const origin = screen==='view' ? 'view' : 'home'; closeModal(); openEditor(id, origin); };
  $('#archBtn').onclick = ()=>{ n.archived=!n.archived; saveNotes(); closeModal(); renderContent(); };
  $('#delModalBtn').onclick = ()=>{ closeModal(); requestDelete(id); };
}

function openCategoryModal(){
  renderCategoryModal();
}
function renderCategoryModal(){
  $('#modalRoot').innerHTML = `
  <div class="modal-overlay" id="ovl">
    <div class="modal">
      <h3>ক্যাটাগরি</h3>
      <div id="catList">${state.categories.map((c,i)=>`
        <div class="category-row">
          <input value="${escapeHtml(c)}" data-catidx="${i}">
          <button class="iconbtn" data-catdel="${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>`).join('')}</div>
      <div class="add-row-inline" style="margin-top:10px;">
        <input id="newCatInput" placeholder="নতুন ক্যাটাগরি">
        <button class="btn sm teal" id="addCatBtn">+</button>
      </div>
      <div class="modal-actions"><button class="btn ghost" id="closeCatBtn">বন্ধ</button></div>
    </div>
  </div>`;
  $('#ovl').onclick = (e)=>{ if(e.target.id==='ovl') closeModal(); };
  $('#closeCatBtn').onclick = closeModal;
  $$('#catList [data-catidx]').forEach(inp=> inp.onchange = ()=>{
    const i = Number(inp.dataset.catidx); const old = state.categories[i]; const val = inp.value.trim() || old;
    state.categories[i] = val;
    state.notes.forEach(n=>{ if(n.category===old) n.category=val; });
    saveCategories(); saveNotes(); renderContent();
  });
  $$('#catList [data-catdel]').forEach(b=> b.onclick = ()=>{
    const i = Number(b.dataset.catdel); const old = state.categories[i];
    if(state.categories.length<=1){ toast('অন্তত একটি ক্যাটাগরি দরকার'); return; }
    state.categories.splice(i,1);
    state.notes.forEach(n=>{ if(n.category===old) n.category='সাধারণ'; });
    if(!state.categories.includes('সাধারণ')) state.categories.push('সাধারণ');
    saveCategories(); saveNotes(); renderContent(); renderCategoryModal();
  });
  $('#addCatBtn').onclick = ()=>{
    const v = $('#newCatInput').value.trim(); if(!v) return;
    if(!state.categories.includes(v)) state.categories.push(v);
    saveCategories(); renderCategoryModal(); renderContent();
  };
}

function openRuleModal(){
  $('#modalRoot').innerHTML = `
  <div class="modal-overlay" id="ovl">
    <div class="modal">
      <h3>নতুন রুল</h3>
      <div class="modal-row"><label>ট্যাগ</label><input id="ruleTag" placeholder="যেমন: Study"></div>
      <div class="modal-row"><label>ক্যাটাগরি</label>
        <select id="ruleCat">${state.categories.map(c=>`<option>${escapeHtml(c)}</option>`).join('')}</select>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="cancelRuleBtn">বাতিল</button>
        <button class="btn primary" id="saveRuleBtn">তৈরি করুন</button>
      </div>
    </div>
  </div>`;
  $('#ovl').onclick = (e)=>{ if(e.target.id==='ovl') closeModal(); };
  $('#cancelRuleBtn').onclick = closeModal;
  $('#saveRuleBtn').onclick = ()=>{
    const tag = $('#ruleTag').value.trim(); if(!tag){ toast('ট্যাগ লিখুন'); return; }
    state.rules.push({ id:uid(), tag, category:$('#ruleCat').value, enabled:true });
    saveRules(); closeModal(); renderContent();
  };
}

function openPinModal(noteId, mode){
  const n = getNote(noteId);
  let entered = '';
  renderPinModal();
  function renderPinModal(){
    const titleTxt = mode==='set' ? '৪ সংখ্যার PIN দিন' : mode==='remove' ? 'বর্তমান PIN দিন' : 'আনলক করতে PIN দিন';
    $('#modalRoot').innerHTML = `
    <div class="modal-overlay" id="ovl">
      <div class="modal" style="max-width:320px;text-align:center;">
        <h3>${titleTxt}</h3>
        <div class="pin-dots">${[0,1,2,3].map(i=>`<div class="dot ${entered.length>i?'filled':''}"></div>`).join('')}</div>
        <div class="keypad">
          ${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-d="${d}">${d}</button>`).join('')}
          <button data-d="clear">C</button><button data-d="0">0</button><button data-d="back">⌫</button>
        </div>
        <div class="modal-actions"><button class="btn ghost" id="cancelPinBtn" style="width:100%;justify-content:center;">বাতিল</button></div>
      </div>
    </div>`;
    $('#ovl').onclick = (e)=>{ if(e.target.id==='ovl'){ closeModal(); if(mode==='unlock'){ screen='home'; render(); } } };
    $('#cancelPinBtn').onclick = ()=>{ closeModal(); if(mode==='unlock'){ screen='home'; render(); } };
    $$('.keypad button').forEach(b=> b.onclick = ()=>{
      const d = b.dataset.d;
      if(d==='clear') entered='';
      else if(d==='back') entered = entered.slice(0,-1);
      else if(entered.length<4) entered += d;
      if(entered.length===4){ handlePinComplete(); return; }
      renderPinModal();
    });
  }
  function handlePinComplete(){
    if(mode==='set'){ n.locked=true; n.pin=entered; saveNotes(); closeModal(); toast('লক করা হয়েছে 🔒'); renderContent(); }
    else if(mode==='remove'){
      if(entered===n.pin){ n.locked=false; n.pin=''; saveNotes(); closeModal(); toast('আনলক হয়েছে 🔓'); renderContent(); }
      else { toast('ভুল PIN'); entered=''; renderPinModal(); }
    } else if(mode==='unlock'){
      if(entered===n.pin){ unlockedNoteIds.add(n.id); closeModal(); render(); }
      else { toast('ভুল PIN'); entered=''; renderPinModal(); }
    }
  }
}

/* ============ Nav & init ============ */

fabBackdrop.onclick = closeFabMenu;

});
$('#fabThemeItem').onclick = ()=>{ state.settings.theme = state.settings.theme==='dark'?'light':'dark'; applyTheme(); saveSettings(); closeFabMenu(); };
